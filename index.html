<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Social Universe</title>

<style>
/* =========================
   ОСНОВНЫЕ НАСТРОЙКИ
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    overflow-x: hidden;
    background: #120018;
}

/* =========================
   GIF ФОН
========================= */

.gif-background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;

    object-fit: cover;
    z-index: -3;
}

/* Затемнение поверх GIF */
.background-overlay {
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            rgba(15, 0, 30, 0.45),
            rgba(30, 0, 45, 0.7)
        );

    backdrop-filter: blur(2px);
    z-index: -2;
}

/* Розово-фиолетовое свечение */
.background-glow {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255, 0, 200, 0.2),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(130, 0, 255, 0.25),
            transparent 40%
        );

    z-index: -1;
    pointer-events: none;
}

/* =========================
   КОНТЕЙНЕР
========================= */

.container {
    width: 100%;
    max-width: 620px;
    margin: auto;
    padding: 45px 20px;
    text-align: center;
}

/* =========================
   АВАТАР
========================= */

.avatar-wrapper {
    position: relative;
    width: 130px;
    height: 130px;
    margin: auto;
}

.avatar {
    width: 130px;
    height: 130px;

    object-fit: cover;
    border-radius: 50%;

    border: 3px solid rgba(255, 255, 255, 0.8);

    box-shadow:
        0 0 15px #ff00cc,
        0 0 40px #a100ff,
        inset 0 0 20px rgba(255,255,255,.2);

    animation: floatAvatar 4s ease-in-out infinite;
}

.avatar-wrapper::before {
    content: "";

    position: absolute;
    inset: -10px;

    border-radius: 50%;
    border: 1px solid #ff4fd8;

    box-shadow: 0 0 25px #ff00cc;

    animation: rotateRing 8s linear infinite;
}

@keyframes floatAvatar {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }

}

@keyframes rotateRing {

    0% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(360deg);
    }

}

/* =========================
   НИК
========================= */

h1 {
    margin-top: 28px;

    font-size: clamp(38px, 8vw, 60px);
    font-weight: 900;
    letter-spacing: -2px;

    background: linear-gradient(
        90deg,
        #ff3fcf,
        #b967ff,
        #ffffff,
        #ff3fcf
    );

    background-size: 300%;

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation: gradientText 5s linear infinite;

    text-shadow: 0 0 30px rgba(255, 0, 200, 0.25);
}

@keyframes gradientText {

    0% {
        background-position: 0%;
    }

    100% {
        background-position: 300%;
    }

}

.description {
    margin-top: 16px;

    color: #e4c9ef;
    font-size: 15px;
    line-height: 1.7;
}

/* =========================
   ССЫЛКИ
========================= */

.links {
    margin-top: 38px;

    display: flex;
    flex-direction: column;
    gap: 15px;
}

.link {
    position: relative;

    display: flex;
    align-items: center;

    padding: 18px 20px;

    border-radius: 22px;

    text-decoration: none;
    color: white;

    /* GLASS EFFECT */
    background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.14),
        rgba(255, 255, 255, 0.04)
    );

    border: 1px solid rgba(255,255,255,.18);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        inset 0 0 20px rgba(255,255,255,.03),
        0 8px 30px rgba(0,0,0,.25);
overflow: hidden;

    transition: all .4s cubic-bezier(.2,.8,.2,1);
}

/* Блик при наведении */
.link::before {
    content: "";

    position: absolute;
    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.18),
        transparent
    );

    transform: skewX(-25deg);
    transition: .8s;
}

.link:hover::before {
    left: 130%;
}

.link:hover {
    transform: translateY(-6px) scale(1.02);

    border-color: rgba(255, 79, 216, .7);

    box-shadow:
        0 15px 40px rgba(255,0,204,.18),
        0 0 25px rgba(140,0,255,.2),
        inset 0 0 20px rgba(255,255,255,.06);
}

/* =========================
   ИКОНКИ
========================= */

.icon {
    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 15px;

    font-size: 23px;

    background: linear-gradient(
        135deg,
        #ff00cc,
        #8a00ff
    );

    box-shadow:
        0 0 15px rgba(255,0,204,.35);

    margin-right: 15px;
}

.text {
    text-align: left;
    flex: 1;
}

.name {
    font-size: 17px;
    font-weight: bold;
}

.username {
    color: #d6b5e5;
    font-size: 12px;
    margin-top: 5px;
}

.arrow {
    font-size: 25px;
    color: #ff8bea;

    transition: .3s;
}

.link:hover .arrow {
    transform: translateX(7px);
    color: white;
}

/* =========================
   ГАЛЕРЕЯ
========================= */

.photos {
    margin-top: 45px;

    padding: 22px;

    border-radius: 25px;

    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);

    backdrop-filter: blur(15px);
}

.photos h2 {
    margin-bottom: 18px;

    font-size: 23px;

    background: linear-gradient(
        90deg,
        #ff4fd8,
        #b967ff
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.gallery img {
    width: 100%;
    aspect-ratio: 1;

    object-fit: cover;

    border-radius: 16px;

    border: 1px solid rgba(255,255,255,.15);

    transition: .4s;
}

.gallery img:hover {
    transform: scale(1.08) rotate(2deg);

    box-shadow:
        0 0 25px #ff00cc88;
}

/* =========================
   ФУТЕР
========================= */

.footer {
    margin-top: 35px;

    color: #c18ad8;
    font-size: 11px;
    letter-spacing: 3px;
}

/* =========================
   МОБИЛЬНАЯ ВЕРСИЯ
========================= */

@media (max-width: 500px) {

    .container {
        padding: 30px 15px;
    }

    h1 {
        font-size: 42px;
    }

    .link {
        padding: 15px;
    }

    .avatar,
    .avatar-wrapper {
        width: 110px;
        height: 110px;
    }

    .photos {
        padding: 15px;
    }

}
</style>
</head>
